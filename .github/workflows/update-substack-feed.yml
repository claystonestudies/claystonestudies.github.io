name: Update Substack feed

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      import_archive:
        description: Import the complete public archive before updating the featured set
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-substack-feed
  cancel-in-progress: false

jobs:
  update-feed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update the catalog and featured snapshot
        env:
          IMPORT_ARCHIVE: ${{ inputs.import_archive || 'false' }}
        run: |
          if [ "$IMPORT_ARCHIVE" = "true" ]; then
            python scripts/update_substack_feed.py --import-archive
          else
            python scripts/update_substack_feed.py
          fi

      - name: Commit an updated snapshot
        run: |
          if git diff --quiet -- data/substack-catalog.json data/substack-posts.json; then
            echo "The checked-in Substack data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/substack-catalog.json data/substack-posts.json
          git commit -m "Update Substack archive snapshot"
          git push origin HEAD:main
